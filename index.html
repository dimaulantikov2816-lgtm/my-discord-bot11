<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANILLA — Рейтинг</title>
    <style>
        :root {
            --bg-color: #08090d;
            --panel-bg: rgba(13, 15, 22, 0.85);
            --border-color: rgba(255, 255, 255, 0.06);
            --accent-color: #89b4fa;
            --text-main: #cdd6f4;
            --text-muted: #6c7086;
            --dark-glow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.7);
            --subtle-glow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 20px 40px; 
            margin: 0;
            min-height: 100vh;
            position: relative;
        }

        /* Фоновое изображение с 20% видимости */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://cdn.discordapp.com/attachments/1543971887309394040/1544314035678355527/CD8523DA-6AD7-4D1A-860B-C717C037751E.png?ex=6a980e06&is=6a96bc86&hm=e7e0c474866a5e7715ac487589fb0c925b3cc2bb831c19b25cf8812fa24d16ea&');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.2;
            z-index: -1;
            pointer-events: none;
        }

        /* Шапка сайта */
        .header {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            box-shadow: var(--dark-glow);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-box {
            width: 54px;
            height: 54px;
            background: rgba(18, 20, 28, 0.9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
        }

        .header-title h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .header-title p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Кнопка Discord */
        .discord-btn {
            background: linear-gradient(135deg, #4752C4, #363db2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(88, 101, 242, 0.4);
        }

        .discord-btn svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        /* Триггер поиска */
        .search-trigger {
            background-color: rgba(10, 11, 16, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 16px;
            height: 54px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 240px;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-trigger:hover {
            border-color: rgba(255, 255, 255, 0.15);
            background-color: rgba(15, 17, 26, 0.9);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .search-trigger span {
            color: var(--text-muted);
            font-size: 14px;
            flex-grow: 1;
        }

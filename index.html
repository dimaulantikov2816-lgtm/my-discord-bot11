<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANILLA — Рейтинг</title>
    <style>
        :root {
            --bg-color: #0d0f17;
            --panel-bg: rgba(22, 24, 35, 0.75);
            --border-color: rgba(137, 180, 250, 0.1);
            --accent-color: #89b4fa;
            --text-main: #cdd6f4;
            --text-muted: #6c7086;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 20px 40px; 
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #1a1c2e 0%, var(--bg-color) 70%);
            min-height: 100vh;
        }

        /* Шапка сайта */
        .header {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-box {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #313244, #181825);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 20px rgba(137, 180, 250, 0.1);
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: drop-shadow(0 0 6px rgba(203, 166, 247, 0.6));
        }

        .header-title h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
            color: #fff;
        }

        .header-title p {
            margin: 4px 0 0 0;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Кнопка Discord */
        .discord-btn {
            background: linear-gradient(135deg, #5865F2, #4752C4);
            border: none;
            border-radius: 12px;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .discord-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
        }

        .discord-btn svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        /* Триггер поиска (кнопка в шапке) */
        .search-trigger {
            background-color: rgba(15, 17, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 16px;
            height: 54px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            width: 240px;
            transition: all 0.2s ease;
        }

        .search-trigger:hover {
            border-color: var(--accent-color);
            background-color: rgba(25, 28, 42, 0.8);
        }

        .search-trigger span {
            color: var(--text-muted);
            font-size: 14px;
            flex-grow: 1;
        }

        .search-trigger kbd {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Модальное окно поиска */
        .search-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .search-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .search-modal {
            background: #141622;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 540px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-modal-overlay.active .search-modal {
            transform: scale(1);
        }

        .search-modal-input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-modal-input-box svg {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        .search-modal-input {
            width: 100%;
            background: rgba(18, 20, 30, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 45px 14px 48px;
            font-size: 15px;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .search-modal-input:focus {
            border-color: var(--accent-color);
        }

        .search-modal-input-box kbd {
            position: absolute;
            right: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .search-modal-empty {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .search-modal-empty svg {
            width: 32px;
            height: 32px;
            fill: var(--text-muted);
            opacity: 0.4;
        }

        /* 5 Столбцов */
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            align-items: start;
        }

        @media (max-width: 1400px) {
            .tier-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .tier-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        }

        .tier-column {
            background-color: var(--panel-bg);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            animation: fadeInColumn 0.5s ease-out both;
        }

        .tier-column:nth-child(1) { animation-delay: 0.05s; }
        .tier-column:nth-child(2) { animation-delay: 0.1s; }
        .tier-column:nth-child(3) { animation-delay: 0.15s; }
        .tier-column:nth-child(4) { animation-delay: 0.2s; }
        .tier-column:nth-child(5) { animation-delay: 0.25s; }

        .tier-header {
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            color: #cdd6f4;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .tier-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #cba6f7;
            box-shadow: 0 0 8px #cba6f7;
        }

        .tier-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 200px;
            max-height: 65vh;
            overflow-y: auto;
        }

        .tier-content::-webkit-scrollbar { width: 4px; }
        .tier-content::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }

        /* Карточка игрока */
        .player-card {
            background-color: rgba(18, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            animation: fadeInCard 0.3s ease both;
            transition: background 0.2s, transform 0.1s;
        }

        .player-card:hover {
            background-color: rgba(30, 33, 48, 0.8);
            transform: translateY(-1px);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background-color: #313244;
            flex-shrink: 0;
            object-fit: cover;
        }

        .player-nick {
            font-weight: 500;
            color: #e2e8f0;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-rank {
            font-weight: 700;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            background-color: rgba(203, 166, 247, 0.15);
            color: #cba6f7;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 30px 0;
        }

        /* Модальное окно профиля игрока */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #181a26;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-avatar {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #313244;
            object-fit: cover;
        }

        .modal-title-box h3 {
            margin: 0;
            font-size: 18px;
            color: #fff;
        }

        .modal-title-box p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: #cba6f7;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-info-row {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-info-label {
            color: var(--text-muted);
        }

        .modal-info-value {
            color: #e2e8f0;
            font-weight: 500;
        }

        .modal-comment-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 4px;
        }

        .modal-comment-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-comment-text {
            font-size: 13px;
            color: #bac2de;
            font-style: italic;
            word-break: break-word;
        }

        .modal-close-btn {
            width: 100%;
            margin-top: 20px;
            background: #313244;
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: #45475a;
        }

        @keyframes fadeInColumn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInCard {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Шапка сайта -->
    <div class="header">
        <div class="header-left">
            <div class="logo-box">
                <img src="https://cdn.discordapp.com/attachments/1485246339083145289/1543677721731797082/105_20260829192905.png?ex=6a970ee9&is=6a95bd69&hm=330f0ec5e645fdec17ee1ee59e95bb551761dd95d72d42d1c3da349bb82023e5&" alt="End Crystal">

                <svg viewBox="0 0 127.14 96.36">

                </svg>
            </a>
        </div>
    </div>

    <!-- Модальное окно поиска -->
    <div class="search-modal-overlay" id="search-modal" onclick="closeSearchModal(event)">
        <div class="search-modal" onclick="event.stopPropagation()">
            <div class="search-modal-input-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="modal-search-input" class="search-modal-input" placeholder="Поиск игрока..." autofocus>
                <kbd>ESC</kbd>
            </div>
            <div id="search-modal-results" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
                <div class="search-modal-empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>Начните вводить ник для поиска...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 5 Столбцов TIER -->
    <div class="tier-grid">
        <div class="tier-column">
            <div class="tier-header"><div class="tier-dot"></div> TIER 1</div>
            <div class="tier-content" id="tier-1"><div class="empty-msg">Загрузка...</div></div>

        <div class="tier-column">
            <div class="tier-header"><div class="tier-dot"></div> TIER 2</div>
            <div class="tier-content" id="tier-2"><div class="empty-msg">Загрузка...</div></div>
        </div>
        <div class="tier-column">
            <div class="tier-header"><div class="tier-dot"></div> TIER 3</div>

        <div class="tier-column">
            <div class="tier-header"><div class="tier-dot"></div> TIER 4</div>
            <div class="tier-content" id="tier-4"><div class="empty-msg">Загрузка...</div></div>
        </div>
        <div class="tier-column">
            <div class="tier-header"><div class="tier-dot"></div> TIER 5</div>
            <div class="tier-content" id="tier-5"><div class="empty-msg">Загрузка...</div></div>
        </div>
    </div>

    <!-- Модальное окно профиля игрока -->
    <div class="modal-overlay" id="player-modal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <img class="modal-avatar" id="modal-avatar" src="" alt="">
                <div class="modal-title-box">

                    <p id="modal-rank">Ранг</p>

            </div>

                </div>
                <button class="modal-close-btn" onclick="closeModalDirect()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cyhsopkvllsliuazldlm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5aHNvcGt2bGxzbGl1YXpsZGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTI1MjIsImV4cCI6MjEwMzc2ODUyMn0.ypkeu5pPJc7jZaOzFURSmQeomdhvUlseQLsowJc_4nQ';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allResults = [];

        const TIER_MAP = {
            'HT1': 1, 'LT1': 1,
            'HT2': 2, 'LT2': 2,
            'HT3': 3, 'LT3': 3,
            'HT4': 4, 'LT4': 4,
            'HT5': 5, 'LT5': 5
        };

        async function loadResults() {
            try {
                const { data, error } = await supabaseClient
                    .from('test_results')
                    .select('*');

                if (error) throw error;

                allResults = data || [];
                renderTiers(allResults);
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`tier-${i}`).innerHTML = '<div class="empty-msg" style="color:#f38ba8;">Ошибка загрузки</div>';
                }
            }
        }

        function sortPlayers(players) {
            return players.sort((a, b) => {
                const rankA = a.rank_type.toUpperCase();
                const rankB = b.rank_type.toUpperCase();
                
                const isHT_A = rankA.startsWith('HT');
                const isHT_B = rankB.startsWith('HT');

                if (isHT_A && !isHT_B) return -1;
                if (!isHT_A && isHT_B) return 1;

                return a.user_id.localeCompare(b.user_id, undefined, { sensitivity: 'base' });
            });
        }

        function renderTiers(data) {
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`tier-${i}`).innerHTML = '';
            }

            const tiers = { 1: [], 2: [], 3: [], 4: [], 5: [] };

            data.forEach(player => {
                const tierNum = TIER_MAP[player.rank_type.toUpperCase()];
                if (tierNum) {
                    tiers[tierNum].push(player);
                }
            });

            for (let i = 1; i <= 5; i++) {
                const container = document.getElementById(`tier-${i}`);
                const sortedPlayers = sortPlayers(tiers[i]);

                if (sortedPlayers.length === 0) {
                    container.innerHTML = '<div class="empty-msg">Пусто</div>';
                    continue;
                }

                sortedPlayers.forEach(player => {
                    const card = document.createElement('div');
                    card.className = 'player-card';

                    const avatarUrl = `https://mc-heads.net/avatar/${encodeURIComponent(player.user_id)}/32`;

                    card.innerHTML = `
                        <div class="player-info">
                            <img class="player-avatar" src="${avatarUrl}" alt="" onerror="this.style.display='none'">
                            <span class="player-nick" title="${escapeHtml(player.user_id)}">${escapeHtml(player.user_id)}</span>
                        </div>
                        <span class="player-rank">${escapeHtml(player.rank_type)}</span>
                    `;

                    card.addEventListener('click', () => openPlayerModal(player));

                    container.appendChild(card);
                });
            }
        }

        function openSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.classList.add('active');
            const input = document.getElementById('modal-search-input');
            input.value = '';
            input.focus();
            renderSearchResults('');
        }

        function closeSearchModal(e) {
            if (!e || e.target === document.getElementById('search-modal') || e.key === 'Escape') {
                document.getElementById('search-modal').classList.remove('active');
            }
        }

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                openSearchModal();
            }
            if (e.key === 'Escape') {
                closeSearchModal(e);
                closeModalDirect();
            }
        });

        document.getElementById('modal-search-input').addEventListener('input', (e) => {
            renderSearchResults(e.target.value.toLowerCase().trim());
        });

        function renderSearchResults(query) {
            const container = document.getElementById('search-modal-results');
            if (!query) {
                container.innerHTML = `
                    <div class="search-modal-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <span>Начните вводить ник для поиска...</span>
                    </div>
                `;
                return;
            }

            const filtered = allResults.filter(player => player.user_id.toLowerCase().includes(query));

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="search-modal-empty">
                        <span>Игроки не найдены</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            filtered.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                const avatarUrl = `https://mc-heads.net/avatar/${encodeURIComponent(player.user_id)}/32`;

                card.innerHTML = `
                    <div class="player-info">
                        <img class="player-avatar" src="${avatarUrl}" alt="" onerror="this.style.display='none'">
                        <span class="player-nick">${escapeHtml(player.user_id)}</span>
                    </div>
                    <span class="player-rank">${escapeHtml(player.rank_type)}</span>
                `;
                card.addEventListener('click', () => {
                    document.getElementById('search-modal').classList.remove('active');
                    openPlayerModal(player);
                });
                container.appendChild(card);
            });
        }

        function openPlayerModal(player) {
            const modalOverlay = document.getElementById('player-modal');
            const avatarImg = document.getElementById('modal-avatar');
            const nickEl = document.getElementById('modal-nick');
            const rankEl = document.getElementById('modal-rank');
            const testerEl = document.getElementById('modal-tester');
            const commentEl = document.getElementById('modal-comment');

            avatarImg.src = `https://mc-heads.net/avatar/${encodeURIComponent(player.user_id)}/64`;
            nickEl.textContent = player.user_id;
            rankEl.textContent = `Ранг: ${player.rank_type}`;
            testerEl.textContent = player.tester_id || 'Не указан';
            
            if (player.comment && player.comment.trim() !== '' && player.comment !== 'Без комментария') {
                commentEl.textContent = player.comment;
                commentEl.style.fontStyle = 'italic';
                commentEl.style.color = '#bac2de';
            } else {
                commentEl.textContent = 'Комментарий отсутствует';
                commentEl.style.fontStyle = 'normal';
                commentEl.style.color = 'var(--text-muted)';
            }

            modalOverlay.classList.add('active');
        }

        function closeModal(e) {
            document.getElementById('player-modal').classList.remove('active');
        }

        function closeModalDirect() {
            document.getElementById('player-modal').classList.remove('active');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        loadResults();
    </script>
</body>
</html>

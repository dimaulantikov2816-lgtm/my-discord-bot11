<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты Игроков</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2e; color: #fff; padding: 30px; }
        h1 { text-align: center; color: #89b4fa; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #313244; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; border: 1px solid #45475a; text-align: center; }
        th { background-color: #45475a; color: #cdd6f4; font-size: 16px; }
        tr:nth-child(even) { background-color: #181825; }
        .rank { font-weight: bold; color: #a6e3a1; font-size: 18px; }
        .comment { font-style: italic; color: #bac2de; font-size: 14px; }
        .nick { font-weight: 600; color: #89b4fa; }
    </style>
    <!-- Подключаем официальный клиент Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>🏆 Таблица результатов игроков</h1>

    <table>
        <thead>
            <tr>
                <th>Ник игрока</th>
                <th>Ранг</th>
                <th>Тестер</th>
                <th>Комментарий</th>
            </tr>
        </thead>
        <tbody id="results-table">
            <tr><td colspan="4">Загрузка данных...</td></tr>
        </tbody>
    </table>

    <script>
        const SUPABASE_URL = 'https://cyhsopkvllsliuazldlm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5aHNvcGt2bGxzbGl1YXpsZGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTI1MjIsImV4cCI6MjEwMzc2ODUyMn0.ypkeu5pPJc7jZaOzFURSmQeomdhvUlseQLsowJc_4nQ';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadResults() {
            const tableBody = document.getElementById('results-table');
            
            try {
                const { data, error } = await supabaseClient
                    .from('test_results')
                    .select('*')
                    .order('updated_at', { ascending: false });

                if (error) throw error;

                tableBody.innerHTML = '';

                if (!data || data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="4">Завершенных тестов пока нет</td></tr>';
                    return;
                }

                data.forEach(item => {
                    const row = `
                        <tr>
                            <td class="nick">${item.user_id}</td>
                            <td class="rank">${item.rank_type}</td>
                            <td>${item.tester_id}</td>
                            <td class="comment">${item.comment || '—'}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                tableBody.innerHTML = '<tr><td colspan="4" style="color: #f38ba8;">Ошибка загрузки данных из БД</td></tr>';
            }
        }

        loadResults();
    </script>
</body>
</html>

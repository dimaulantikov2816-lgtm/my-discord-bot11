<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Топ Игроков по TIER</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e2e; 
            color: #fff; 
            padding: 20px; 
            margin: 0;
        }
        h1 { text-align: center; color: #89b4fa; margin-bottom: 20px; }
        
        /* Блок поиска */
        .search-container {
            max-width: 500px;
            margin: 0 auto 25px auto;
        }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #45475a;
            background-color: #313244;
            color: #fff;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .search-input:focus {
            border-color: #89b4fa;
            box-shadow: 0 0 10px rgba(137, 180, 250, 0.2);
        }

        /* Контейнер 5 столбцов */
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .tier-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }
        }

        /* Стиль каждого TIER-столбца */
        .tier-column {
            background-color: #313244;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #45475a;
            /* Анимация появления самой колонки */
            animation: fadeInColumn 0.6s ease-out both;
        }

        /* Плавная задержка для каждой колонки, чтобы они появлялись по очереди */
        .tier-column:nth-child(1) { animation-delay: 0.1s; }
        .tier-column:nth-child(2) { animation-delay: 0.2s; }
        .tier-column:nth-child(3) { animation-delay: 0.3s; }
        .tier-column:nth-child(4) { animation-delay: 0.4s; }
        .tier-column:nth-child(5) { animation-delay: 0.5s; }

        .tier-header {
            background-color: #45475a;
            color: #cdd6f4;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 12px;
            border-bottom: 2px solid #585b70;
        }

        .tier-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 100px;
        }

        /* Карточка игрока с анимацией появления */
        .player-card {
            background-color: #181825;
            border: 1px solid #45475a;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            /* Анимация */
            animation: fadeInCard 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        /* Легкий эффект при наведении мыши на карточку */
        .player-card:hover {
            transform: translateY(-2px;);
            border-color: #89b4fa;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-nick {
            font-weight: 600;
            color: #89b4fa;
            font-size: 15px;
            word-break: break-word;
        }

        .player-rank {
            font-weight: bold;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #45475a;
            color: #a6e3a1;
        }

        .player-tester {
            font-size: 12px;
            color: #a6adc8;
        }

        .player-comment {
            font-size: 12px;
            font-style: italic;
            color: #bac2de;
            border-top: 1px dashed #45475a;
            padding-top: 4px;
            margin-top: 2px;
            word-break: break-word;
        }

        .empty-msg {
            text-align: center;
            color: #6c7086;
            font-size: 14px;
            padding: 20px 0;
        }

        /* Ключевые кадры анимаций */
        @keyframes fadeInColumn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
    </style>
    <!-- Подключаем официальный клиент Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>🏆 Сетка игроков по TIER</h1>

    <!-- Поле поиска -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Поиск по нику...">
    </div>

    <!-- 5 Столбцов -->
    <div class="tier-grid">
        <div class="tier-column">
            <div class="tier-header">TIER 1</div>
            <div class="tier-content" id="tier-1"><div class="empty-msg">Загрузка...</div></div>
        </div>
        <div class="tier-column">
            <div class="tier-header">TIER 2</div>
            <div class="tier-content" id="tier-2"><div class="empty-msg">Загрузка...</div></div>
        </div>
        <div class="tier-column">
            <div class="tier-header">TIER 3</div>
            <div class="tier-content" id="tier-3"><div class="empty-msg">Загрузка...</div></div>
        </div>
        <div class="tier-column">
            <div class="tier-header">TIER 4</div>
            <div class="tier-content" id="tier-4"><div class="empty-msg">Загрузка...</div></div>
        </div>
        <div class="tier-column">
            <div class="tier-header">TIER 5</div>
            <div class="tier-content" id="tier-5"><div class="empty-msg">Загрузка...</div></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cyhsopkvllsliuazldlm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5aHNvcGt2bGxzbGl1YXpsZGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTI1MjIsImV4cCI6MjEwMzc2ODUyMn0.ypkeu5pPJc7jZaOzFURSmQeomdhvUlseQLsowJc_4nQ';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allResults = [];

        const TIER_MAP = {
            'HT1': 1, 'LT1': 1,
            'HT2': 2, 'LT2': 2,
            'HT3': 3, 'LT3': 3,
            'HT4': 4, 'LT4': 4,
            'HT5': 5, 'LT5': 5
        };

        async function loadResults() {
            try {
                const { data, error } = await supabaseClient
                    .from('test_results')
                    .select('*');

                if (error) throw error;

                allResults = data || [];
                renderTiers(allResults);
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                for (let i = 1; i <= 5; i++) {
                    document.getElementById(`tier-${i}`).innerHTML = '<div class="empty-msg" style="color:#f38ba8;">Ошибка</div>';
                }
            }
        }

        function sortPlayers(players) {
            return players.sort((a, b) => {
                const rankA = a.rank_type.toUpperCase();
                const rankB = b.rank_type.toUpperCase();
                
                const isHT_A = rankA.startsWith('HT');
                const isHT_B = rankB.startsWith('HT');

                if (isHT_A && !isHT_B) return -1;
                if (!isHT_A && isHT_B) return 1;

                return a.user_id.localeCompare(b.user_id, undefined, { sensitivity: 'base' });
            });
        }

        function renderTiers(data) {
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`tier-${i}`).innerHTML = '';
            }

            const tiers = { 1: [], 2: [], 3: [], 4: [], 5: [] };

            data.forEach(player => {
                const tierNum = TIER_MAP[player.rank_type.toUpperCase()];
                if (tierNum) {
                    tiers[tierNum].push(player);
                }
            });

            for (let i = 1; i <= 5; i++) {
                const container = document.getElementById(`tier-${i}`);
                const sortedPlayers = sortPlayers(tiers[i]);

                if (sortedPlayers.length === 0) {
                    container.innerHTML = '<div class="empty-msg">Пусто</div>';
                    continue;
                }

                sortedPlayers.forEach(player => {
                    const card = document.createElement('div');
                    card.className = 'player-card';

                    const commentHTML = player.comment && player.comment !== 'Без комментария' 
                        ? `<div class="player-comment">${escapeHtml(player.comment)}</div>` 
                        : '';

                    card.innerHTML = `
                        <div class="card-top">
                            <span class="player-nick">${escapeHtml(player.user_id)}</span>
                            <span class="player-rank">${escapeHtml(player.rank_type)}</span>
                        </div>
                        <div class="player-tester">Тестер: ${escapeHtml(player.tester_id)}</div>
                        ${commentHTML}
                    `;
                    container.appendChild(card);
                });
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allResults.filter(player => 
                player.user_id.toLowerCase().includes(query)
            );
            renderTiers(filtered);
        });

        loadResults();
    </script>
</body>
</html>

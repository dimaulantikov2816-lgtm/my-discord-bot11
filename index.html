<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d11">
  <title>VANILLA — Рейтинг</title>
  <link rel="preconnect" href="https://mc-heads.net">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #08090d;
      --panel: rgba(16, 18, 24, 0.82);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8edf4;
      --muted: #8b93a3;
      --accent: #89b4fa;
      --ht: #d4b07a;
      --lt: #89c4d4;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Segoe UI, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("bg-deepslate.png") center / cover no-repeat;
      image-rendering: pixelated;
      filter: brightness(0.72);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(8, 9, 13, 0.35) 0%, rgba(8, 9, 13, 0.72) 100%);
      pointer-events: none;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 48px;
    }

    .topbar, .testers, .col, .modal {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-radius: 16px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      object-fit: cover;
      image-rendering: pixelated;
    }
    .brand strong { display: block; font-size: 20px; letter-spacing: 0.08em; }
    .brand span {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .top-actions { display: flex; align-items: center; gap: 10px; }

    .search-trigger {
      width: 240px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(8, 9, 13, 0.65);
      color: var(--muted);
      cursor: pointer;
    }
    .search-trigger span { flex: 1; text-align: left; font-size: 14px; }
    .search-trigger kbd {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
    }

    .discord {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #4752c4, #363db2);
      color: #fff;
      text-decoration: none;
    }

    .testers {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 16px;
    }
    .testers > b {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      margin-right: 4px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px 5px 5px;
      border-radius: 999px;
      background: rgba(8, 9, 13, 0.55);
      border: 1px solid var(--line);
      font-size: 13px;
    }
    .chip img, .row img, .result-row img { width: 22px; height: 22px; border-radius: 5px; image-rendering: pixelated; }
    .chip em { color: var(--accent); font-style: normal; font-weight: 700; font-size: 12px; }

    .board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
      align-items: start;
    }

    .col {
      min-height: 280px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.78) 0%, rgba(28, 32, 42, 0.78) 100%);
    }
    .col.t1 { background: linear-gradient(180deg, rgba(40, 32, 14, 0.88), rgba(16, 18, 24, 0.86)); }
    .col.t2 { background: linear-gradient(180deg, rgba(28, 34, 42, 0.9), rgba(16, 18, 24, 0.86)); }
    .col.t3 { background: linear-gradient(180deg, rgba(16, 38, 36, 0.9), rgba(16, 18, 24, 0.86)); }
    .col.t4 { background: linear-gradient(180deg, rgba(16, 28, 46, 0.9), rgba(16, 18, 24, 0.86)); }
    .col.t5 { background: linear-gradient(180deg, rgba(32, 22, 44, 0.9), rgba(16, 18, 24, 0.86)); }

    .col h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 14px 10px;
      font-size: 13px;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--line);
    }
    .col h2::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .list { padding: 10px; display: grid; gap: 8px; min-height: 180px; }
